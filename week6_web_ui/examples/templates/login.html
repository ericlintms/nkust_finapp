<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_title }} - 登入</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(27, 71, 117, 0.25), transparent 28%),
                linear-gradient(180deg, #0f2744 0%, #143455 45%, #1f4b78 100%);
        }

        .login-card {
            border: 0;
            border-radius: 1.4rem;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.16);
        }

        .form-control {
            border-radius: 0.85rem;
            padding-top: 0.9rem;
            padding-bottom: 0.9rem;
        }

        .btn-login {
            border: 0;
            border-radius: 0.9rem;
            background: linear-gradient(135deg, #c8a95b, #dfc98f);
            color: #17253a;
            font-weight: 700;
        }
    </style>
</head>

<body class="d-flex align-items-center">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="login-card card">
                    <div class="card-body p-4 p-lg-5">
                        <div class="text-center mb-4">
                            <div class="text-uppercase text-secondary small fw-semibold mb-2">JWT Login Demo</div>
                            <h1 class="h3 mb-3">{{ app_title }}</h1>
                            <p class="text-muted mb-0">請輸入預先建立好的帳號與密碼登入，系統不提供註冊功能。</p>
                        </div>

                        {% if error_message %}
                        <div class="alert alert-danger" role="alert">
                            {{ error_message }}
                        </div>
                        {% endif %}

                        <form method="post" action="/login" class="vstack gap-3">
                            <div>
                                <label for="userid" class="form-label">帳號</label>
                                <input id="userid" name="userid" type="text" class="form-control" required
                                    autocomplete="username" value="{{ userid }}">
                            </div>
                            <div>
                                <label for="passwd" class="form-label">密碼</label>
                                <input id="passwd" name="passwd" type="password" class="form-control" required
                                    autocomplete="current-password">
                            </div>
                            <button type="submit" class="btn btn-login btn-lg w-100">登入系統</button>
                        </form>

                        <div class="mt-4 small text-muted">
                            auth.db 會存放在 <code>week6_web_ui/examples/</code>，可搭配 <code>manage_users.py</code> 管理示範帳號。
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
